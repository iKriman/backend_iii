spring.application.name=notification-service
server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
spring.jms.listener.session-transacted=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=bank-services
spring.artemis.mode=native
spring.artemis.broker-url=${JMS_BROKER_URL:tcp://localhost:61616?connectionTTL=60000&clientFailureCheckPeriod=30000&callTimeout=5000&initialConnectAttempts=3&reconnectAttempts=3}
spring.artemis.user=${ARTEMIS_USER:bank}
spring.artemis.password=${ARTEMIS_PASSWORD}
bank.events.queue=bank.migration.events
